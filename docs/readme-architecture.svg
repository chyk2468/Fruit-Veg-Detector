<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Fruit &amp; Vegetable Detector workflow</title><desc id="desc">A CNN-based image classifier trained and tested through notebooks, with a saved Keras model and label mapping for inference.</desc><rect width="1200" height="400" rx="18" fill="#F4F2E7"/>
<text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#4D7E45">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#2F3D2D">Fruit &amp; Vegetable Detector</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#727B68">A 36-class image classification pipeline</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#D7DDC9"/><path d="M 300 237 L 330 237" stroke="#727B68" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#727B68" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#727B68" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#727B68" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#727B68" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#727B68" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFDF7" stroke="#D7DDC9" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#4D7E45"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#4D7E45">01 / IMAGE</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2F3D2D">Input photo</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#727B68">Load an image of produce.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFDF7" stroke="#D7DDC9" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#D98B35"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#D98B35">02 / PREPROCESS</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2F3D2D">Resize and scale</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#727B68">Match training input format.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFDF7" stroke="#D7DDC9" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#8B9C5B"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#8B9C5B">03 / CNN MODEL</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2F3D2D">fruit_model.h5</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#727B68">Predict the most likely class.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFDF7" stroke="#D7DDC9" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#4D7E45"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#4D7E45">04 / LABEL</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2F3D2D">36 categories</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#727B68">Map predicted index to labels.txt.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#4D7E45">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#727B68">The displayed class is a model prediction, not a guarantee of correct identification.</text></svg>